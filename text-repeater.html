<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Repeater</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #1a1d26;
      --border: #252836;
      --accent: #00f5a0;
      --accent2: #00d4ff;
      --danger: #ff4d6d;
      --text: #e8eaf6;
      --muted: #6b7194;
      --glow: 0 0 24px rgba(0,245,160,0.18);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,160,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; background: #00f5a0; top: -150px; left: -150px; }
    .orb-2 { width: 400px; height: 400px; background: #00d4ff; bottom: -100px; right: -100px; }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,245,160,0.1);
      border: 1px solid rgba(0,245,160,0.25);
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .badge::before { content: '◆'; font-size: 8px; }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-family: 'Space Mono', monospace;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease both;
    }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:nth-child(4) { animation-delay: 0.3s; }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
      padding: 16px;
      resize: vertical;
      min-height: 130px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,245,160,0.08);
    }
    textarea::placeholder { color: var(--muted); }

    .char-counter {
      text-align: right;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Controls row */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }

    .control-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
    }

    /* Number stepper */
    .stepper {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .stepper:focus-within { border-color: var(--accent); }
    .stepper button {
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .stepper button:hover { background: rgba(0,245,160,0.1); }
    .stepper input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      outline: none;
      width: 0;
    }
    /* Hide number arrows */
    .stepper input::-webkit-inner-spin-button,
    .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .stepper input { -moz-appearance: textfield; }

    /* Separator pills */
    .sep-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sep-pill {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sep-pill:hover { border-color: var(--accent); color: var(--accent); }
    .sep-pill.active {
      background: rgba(0,245,160,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Custom separator input */
    .custom-sep-wrap {
      margin-top: 10px;
      display: none;
    }
    .custom-sep-wrap.show { display: block; }
    .custom-sep-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .custom-sep-wrap input:focus { border-color: var(--accent); }

    /* Toggles */
    .toggle-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-item input[type="checkbox"] { display: none; }
    .toggle-track {
      width: 40px;
      height: 22px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      position: relative;
      transition: all 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      background: var(--muted);
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: all 0.2s;
    }
    .toggle-item input:checked + .toggle-track {
      background: rgba(0,245,160,0.15);
      border-color: var(--accent);
    }
    .toggle-item input:checked + .toggle-track::after {
      background: var(--accent);
      left: 21px;
    }
    .toggle-label {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    /* Action buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .btn:active::after { opacity: 0.1; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #00c4d4);
      color: #000;
      flex: 1;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,245,160,0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,245,160,0.4);
    }
    .btn-ghost {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* Output */
    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .output-stats {
      display: flex;
      gap: 16px;
    }
    .stat-chip {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .stat-chip span { color: var(--accent); font-weight: 700; }

    #output {
      min-height: 160px;
      cursor: text;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .copy-btn.copied { border-color: var(--accent); color: var(--accent); }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      gap: 10px;
    }
    .empty-icon { font-size: 32px; opacity: 0.4; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 30px;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Pulse ring on repeat btn */
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(0,245,160,0.5); }
      70% { box-shadow: 0 0 0 12px rgba(0,245,160,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,245,160,0); }
    }
    .btn-primary.pulse { animation: pulse-ring 0.5s ease; }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="badge">Free Online Tool</div>
    <h1>Text Repeater</h1>
    <p class="subtitle">// type · set count · repeat · copy · done</p>
  </header>

  <!-- Input Card -->
  <div class="card">
    <div class="section-label">01 · Your Text</div>
    <textarea id="inputText" placeholder="Type or paste your text here... (emojis work too 🔥)" rows="5"></textarea>
    <div class="char-counter"><span id="inputCount">0</span> characters · <span id="wordCount">0</span> words</div>
  </div>

  <!-- Settings Card -->
  <div class="card">
    <div class="section-label">02 · Settings</div>
    <div class="controls-grid">

      <!-- Repeat Count -->
      <div class="control-group">
        <label>Repeat Times</label>
        <div class="stepper">
          <button onclick="changeCount(-1)">−</button>
          <input type="number" id="repeatCount" value="5" min="1" max="9999" />
          <button onclick="changeCount(1)">+</button>
        </div>
      </div>

      <!-- Separator -->
      <div class="control-group">
        <label>Separator Between Repetitions</label>
        <div class="sep-pills" id="sepPills">
          <div class="sep-pill active" data-sep="none">None</div>
          <div class="sep-pill" data-sep="space">Space</div>
          <div class="sep-pill" data-sep="newline">New Line</div>
          <div class="sep-pill" data-sep="comma">Comma</div>
          <div class="sep-pill" data-sep="dash">Dash</div>
          <div class="sep-pill" data-sep="custom">Custom</div>
        </div>
        <div class="custom-sep-wrap" id="customWrap">
          <input type="text" id="customSep" placeholder="Custom separator (e.g.  |  or  ---)" />
        </div>
      </div>
    </div>

    <!-- Toggles -->
    <div class="control-group" style="margin-top: 20px;">
      <label>Extra Options</label>
      <div class="toggle-row">
        <label class="toggle-item">
          <input type="checkbox" id="trimToggle" />
          <div class="toggle-track"></div>
          <span class="toggle-label">Trim whitespace</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="numberToggle" />
          <div class="toggle-track"></div>
          <span class="toggle-label">Add numbers (1. 2. 3.)</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="upperToggle" />
          <div class="toggle-track"></div>
          <span class="toggle-label">UPPERCASE</span>
        </label>
      </div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-primary" id="repeatBtn" onclick="repeatText()">
        <span>⟳</span> Repeat Text
      </button>
      <button class="btn btn-ghost" onclick="clearAll()">
        <span>✕</span> Clear
      </button>
    </div>
  </div>

  <!-- Output Card -->
  <div class="card">
    <div class="output-header">
      <div class="section-label" style="margin-bottom:0; flex:1">03 · Output</div>
      <div class="output-stats">
        <div class="stat-chip">Chars: <span id="outChars">0</span></div>
        <div class="stat-chip">Lines: <span id="outLines">0</span></div>
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()">
          <span>⎘</span> Copy
        </button>
      </div>
    </div>

    <div id="outputWrap">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">◇</div>
        <span>Your output will appear here...</span>
      </div>
      <textarea id="output" style="display:none;" readonly></textarea>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">✓ Copied to clipboard!</div>

<script>
  const separators = {
    none: '',
    space: ' ',
    newline: '\n',
    comma: ', ',
    dash: ' — ',
    custom: null
  };
  let currentSep = 'none';

  // Live char/word counter
  document.getElementById('inputText').addEventListener('input', function () {
    const val = this.value;
    document.getElementById('inputCount').textContent = val.length;
    const words = val.trim() === '' ? 0 : val.trim().split(/\s+/).length;
    document.getElementById('wordCount').textContent = words;
  });

  // Separator pills
  document.querySelectorAll('.sep-pill').forEach(pill => {
    pill.addEventListener('click', function () {
      document.querySelectorAll('.sep-pill').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      currentSep = this.dataset.sep;
      const wrap = document.getElementById('customWrap');
      wrap.classList.toggle('show', currentSep === 'custom');
    });
  });

  // Stepper buttons
  function changeCount(delta) {
    const input = document.getElementById('repeatCount');
    let val = parseInt(input.value) || 1;
    val = Math.max(1, Math.min(9999, val + delta));
    input.value = val;
  }

  function repeatText() {
    let text = document.getElementById('inputText').value;
    if (!text) { showToast('⚠ Please enter some text first!', '#ff4d6d'); return; }

    let countRaw = parseInt(document.getElementById('repeatCount').value);
    if (isNaN(countRaw) || countRaw < 1) countRaw = 1;
    if (countRaw > 9999) countRaw = 9999;
    document.getElementById('repeatCount').value = countRaw;
    const count = countRaw;

    const trim = document.getElementById('trimToggle').checked;
    const numbered = document.getElementById('numberToggle').checked;
    const upper = document.getElementById('upperToggle').checked;

    if (trim) text = text.trim();
    if (upper) text = text.toUpperCase();

    let sep;
    if (currentSep === 'custom') {
      sep = document.getElementById('customSep').value;
    } else {
      sep = separators[currentSep];
    }

    let parts = [];
    for (let i = 1; i <= count; i++) {
      parts.push(numbered ? `${i}. ${text}` : text);
    }

    const result = parts.join(sep);

    // Show output
    const outEl = document.getElementById('output');
    const emptyEl = document.getElementById('emptyState');
    outEl.style.display = 'block';
    emptyEl.style.display = 'none';
    outEl.value = result;

    // Update stats
    document.getElementById('outChars').textContent = result.length.toLocaleString();
    document.getElementById('outLines').textContent = result.split('\n').length.toLocaleString();

    // Pulse animation
    const btn = document.getElementById('repeatBtn');
    btn.classList.remove('pulse');
    void btn.offsetWidth;
    btn.classList.add('pulse');
  }

  function copyOutput() {
    const out = document.getElementById('output').value;
    if (!out) { showToast('⚠ Nothing to copy yet!', '#ff4d6d'); return; }
    navigator.clipboard.writeText(out).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = '<span>✓</span> Copied!';
      showToast('✓ Copied to clipboard!', '#00f5a0');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<span>⎘</span> Copy';
      }, 2000);
    }).catch(() => {
      showToast('⚠ Copy failed — please select & copy manually.', '#ff4d6d');
    });
  }

  function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('repeatCount').value = 5;
    document.getElementById('output').value = '';
    document.getElementById('output').style.display = 'none';
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('inputCount').textContent = '0';
    document.getElementById('wordCount').textContent = '0';
    document.getElementById('outChars').textContent = '0';
    document.getElementById('outLines').textContent = '0';
    document.getElementById('trimToggle').checked = false;
    document.getElementById('numberToggle').checked = false;
    document.getElementById('upperToggle').checked = false;
    // Reset separator to "None"
    currentSep = 'none';
    document.querySelectorAll('.sep-pill').forEach(p => p.classList.remove('active'));
    document.querySelector('[data-sep="none"]').classList.add('active');
    document.getElementById('customWrap').classList.remove('show');
    document.getElementById('customSep').value = '';
  }

  let toastTimer;
  function showToast(msg, color = '#00f5a0') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = color;
    t.style.color = color === '#ff4d6d' ? '#fff' : '#000';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Enter key shortcut
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') repeatText();
  });
</script>
</body>
</html>
